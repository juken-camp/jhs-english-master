<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173f6b">
<meta name="description" content="英文法のしくみ、動詞と時制、入試文法24項目をひとつにまとめた中学生向け英文法教材。">
<title>中学英文法 完全攻略｜JUKEN CAMP</title>
<style>
:root{
  --paper:#f8f6f0;
  --paper-deep:#eee9de;
  --ink:#15171c;
  --navy:#173f6b;
  --navy-deep:#0d2948;
  --red:#b7252d;
  --gold:#f0cb57;
  --line:#d9d4c9;
  --muted:#656a74;
  --white:#fff;
  --shadow:0 16px 40px rgba(23,63,107,.11);
}
*{box-sizing:border-box}
html{min-height:100%;max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;scroll-behavior:smooth;overscroll-behavior-x:none}
body{
  margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink);touch-action:pan-y;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
}
button{font:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.home-screen{
  min-height:100dvh;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 8% 8%,rgba(240,203,87,.3),transparent 25%),
    radial-gradient(circle at 95% 18%,rgba(183,37,45,.08),transparent 22%),
    linear-gradient(150deg,#fbfaf6 0%,#f6f2e9 56%,#ece7dc 100%);
}
.home-screen::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(23,63,107,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(23,63,107,.045) 1px,transparent 1px);
  background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 80%);
}
.home-wrap{width:min(1080px,calc(100% - 40px));margin:0 auto;padding:26px 0 48px;position:relative;z-index:1}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.brand{font-weight:800;color:var(--navy);letter-spacing:.2em;font-size:13px}
.brand::before{content:"";display:inline-block;width:22px;height:3px;background:var(--red);margin:0 9px 4px 0}
.edition{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.55)}
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:34px;align-items:end;margin-bottom:34px}
.eyebrow{margin:0 0 10px;color:var(--red);font-size:12px;font-weight:800;letter-spacing:.25em}
h1{margin:0;color:var(--navy-deep);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;font-size:clamp(38px,6vw,72px);line-height:1.06;letter-spacing:-.045em;font-weight:700}
h1 span{display:block;color:var(--navy);font-size:.69em;letter-spacing:.04em;margin-top:8px}
.hero-copy{margin:18px 0 0;color:var(--muted);font-size:clamp(15px,1.8vw,18px);line-height:1.85;font-weight:500}
.hero-copy b{color:var(--ink);background:linear-gradient(transparent 64%,rgba(240,203,87,.65) 64%)}
.route-note{border-left:3px solid var(--red);padding:5px 0 5px 18px;margin-bottom:6px}
.route-note .small{margin:0 0 5px;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.17em}
.route-note p{margin:0;color:var(--navy-deep);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:18px;font-weight:700;line-height:1.65}
.route-note span{display:block;margin-top:5px;color:var(--muted);font-family:inherit;font-size:12px;font-weight:500}
.books{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.book{
  position:relative;min-height:252px;border:1px solid var(--line);border-top:5px solid var(--navy);border-radius:3px 3px 18px 3px;
  background:rgba(255,255,255,.92);box-shadow:var(--shadow);padding:20px 20px 18px;text-align:left;color:inherit;cursor:pointer;
  display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.book:nth-child(2){border-top-color:var(--red)}
.book:nth-child(3){border-top-color:#9e7818}
.book::after{content:"";position:absolute;right:0;bottom:0;border-style:solid;border-width:0 0 22px 22px;border-color:transparent transparent var(--paper-deep) transparent}
.book:hover{transform:translateY(-5px);box-shadow:0 22px 48px rgba(23,63,107,.16);border-color:#b9c2cc}
.book-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.step{font-family:Georgia,serif;color:var(--navy);font-size:12px;font-weight:800;letter-spacing:.16em}
.book:nth-child(2) .step{color:var(--red)}
.book:nth-child(3) .step{color:#8d6710}
.level{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:4px 8px;white-space:nowrap}
.book h2{margin:0 0 10px;color:var(--navy-deep);font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;font-size:23px;line-height:1.4;letter-spacing:-.03em}
.book p{margin:0;color:var(--muted);font-size:13px;line-height:1.75}
.book-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:18px;border-top:1px solid #ece8df;color:var(--navy);font-size:12px;font-weight:800}
.arrow{font-size:22px;line-height:1;transition:transform .2s ease}
.book:hover .arrow{transform:translateX(4px)}
.home-footer{display:flex;justify-content:space-between;gap:18px;margin-top:22px;color:var(--muted);font-size:11px;line-height:1.6}
.home-footer strong{color:var(--navy);letter-spacing:.12em}
.reader{display:none;position:fixed;inset:0;z-index:10;background:var(--paper)}
.reader.is-open{display:grid;grid-template-rows:62px minmax(0,1fr)}
.reader-bar{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--navy-deep);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.15);z-index:2}
.home-button,.print-button,.doc-tab{border:0;cursor:pointer}
.home-button,.print-button{height:42px;border-radius:10px;color:#fff;background:rgba(255,255,255,.11);font-weight:700}
.home-button{padding:0 14px;display:flex;align-items:center;gap:8px}
.home-button span:first-child{font-size:21px;line-height:1}
.reader-title{min-width:148px}
.reader-title small{display:block;color:#cfd9e4;font-size:9px;letter-spacing:.17em;font-weight:700;margin-bottom:2px}
.reader-title strong{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-tabs{display:flex;gap:5px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.doc-tabs::-webkit-scrollbar{display:none}
.doc-tab{height:38px;padding:0 12px;border-radius:8px;background:transparent;color:#cfd9e4;font-size:11px;font-weight:700;white-space:nowrap}
.doc-tab:hover{background:rgba(255,255,255,.08);color:#fff}
.doc-tab.is-active{background:#fff;color:var(--navy-deep)}
.print-button{padding:0 14px;margin-left:4px;white-space:nowrap}
.home-button:hover,.print-button:hover{background:rgba(255,255,255,.18)}
.reader-stage{position:relative;min-height:0;background:var(--paper-deep)}
#doc-frame{display:block;width:100%;height:100%;border:0;background:var(--paper)}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--paper);color:var(--navy);font-size:13px;font-weight:700;letter-spacing:.12em;transition:opacity .18s ease}
.loading.is-hidden{opacity:0;pointer-events:none}
@media(max-width:760px){
  .home-wrap{width:min(100% - 28px,580px);padding-top:18px}
  .brandbar{margin-bottom:28px}
  .hero{grid-template-columns:1fr;gap:24px;margin-bottom:26px}
  h1{font-size:clamp(38px,13.4vw,58px)}
  .route-note{margin:0}
  .books{grid-template-columns:1fr;gap:12px}
  .book{min-height:0;padding:17px 17px 15px;border-radius:3px 3px 14px 3px}
  .book-top{margin-bottom:10px}
  .book h2{font-size:20px;margin-bottom:6px}
  .book-foot{padding-top:12px;margin-top:13px}
  .home-footer{display:block}.home-footer span{display:block;margin-top:5px}
  .reader.is-open{grid-template-rows:60px minmax(0,1fr)}
  .reader-bar{padding:7px 8px;gap:6px}
  .home-button,.print-button{height:44px}
  .home-button{width:44px;padding:0;justify-content:center}
  .home-button .home-label,.reader-title{display:none}
  .doc-tabs{margin-left:0;flex:1}
  .doc-tab{padding:0 10px;height:44px;font-size:10.5px}
  .print-button{width:44px;padding:0;font-size:0}
  .print-button::before{content:"印";font-size:13px}
}
@media(max-width:390px){
  .doc-tab{padding:0 8px}.doc-tab .long{display:none}
  .edition{display:none}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.home-screen,.reader-bar{display:none!important}.reader{display:block;position:static}.reader-stage{height:auto}#doc-frame{height:100vh}}
</style>
</head>
<body>
<main class="home-screen" id="home-screen">
  <div class="home-wrap">
    <div class="brandbar">
      <div class="brand">JUKEN CAMP</div>
      <div class="edition">3 BOOKS IN 1</div>
    </div>
    <section class="hero" aria-labelledby="app-title">
      <div>
        <p class="eyebrow">JUNIOR HIGH SCHOOL ENGLISH</p>
        <h1 id="app-title">中学英文法<span>完全攻略</span></h1>
        <p class="hero-copy"><b>「しくみをつかむ」「動詞を整理する」「必要な文法を引く」</b><br>3つの教材を、ひとつのアプリにまとめました。</p>
      </div>
      <div class="route-note">
        <p class="small">RECOMMENDED ROUTE</p>
        <p>① しくみ → ② 動詞・時制 → ③ バイブル</p>
        <span>順番に読んでも、必要なところだけ選んでもOK。</span>
      </div>
    </section>
    <section class="books" aria-label="教材を選ぶ">
      <button class="book" type="button" data-doc="structure">
        <span class="book-top"><span class="step">BOOK 01</span><span class="level">土台をつくる</span></span>
        <h2>中学英文法のしくみ</h2>
        <p>語順・5文型・動詞など、これから習う英文法の全体像をつかむ。</p>
        <span class="book-foot"><span>全6章＋巻末付録</span><span class="arrow" aria-hidden="true">→</span></span>
      </button>
      <button class="book" type="button" data-doc="tense">
        <span class="book-top"><span class="step">BOOK 02</span><span class="level">変化を見抜く</span></span>
        <h2>動詞と時制のしくみ</h2>
        <p>be動詞と一般動詞が、疑問文・否定文・時制でどう変わるかを整理する。</p>
        <span class="book-foot"><span>変形表＋5つのルール</span><span class="arrow" aria-hidden="true">→</span></span>
      </button>
      <button class="book" type="button" data-doc="bible">
        <span class="book-top"><span class="step">BOOK 03</span><span class="level">入試まで使う</span></span>
        <h2>英文法・完全攻略バイブル</h2>
        <p>中1から高校入試までの重要文法を、必要なときに引いて確認する。</p>
        <span class="book-foot"><span>重要文法24項目</span><span class="arrow" aria-hidden="true">→</span></span>
      </button>
    </section>
    <footer class="home-footer">
      <strong>JUKEN CAMP</strong>
      <span>問題を解く前に、英語の「地図」を手に入れよう。</span>
    </footer>
  </div>
</main>

<section class="reader" id="reader" aria-label="英文法教材">
  <header class="reader-bar">
    <button class="home-button" id="home-button" type="button" aria-label="トップ画面にもどる"><span aria-hidden="true">‹</span><span class="home-label">トップ</span></button>
    <div class="reader-title"><small>中学英文法 完全攻略</small><strong id="reader-heading">教材</strong></div>
    <nav class="doc-tabs" aria-label="教材を切り替える">
      <button class="doc-tab" type="button" data-doc="structure">1 <span class="long">英文法の</span>しくみ</button>
      <button class="doc-tab" type="button" data-doc="tense">2 動詞<span class="long">と時制</span></button>
      <button class="doc-tab" type="button" data-doc="bible">3 <span class="long">文法</span>バイブル</button>
    </nav>
    <button class="print-button" id="print-button" type="button" aria-label="開いている教材を印刷">印刷</button>
  </header>
  <div class="reader-stage">
    <iframe id="doc-frame" title="英文法教材"></iframe>
    <div class="loading is-hidden" id="loading" role="status">教材を開いています</div>
  </div>
</section>

const META={
  structure:{title:"中学英文法のしくみ"},
  tense:{title:"動詞と時制のしくみ"},
  bible:{title:"英文法・完全攻略バイブル"}
};
const homeScreen=document.getElementById("home-screen");
const reader=document.getElementById("reader");
const frame=document.getElementById("doc-frame");
const heading=document.getElementById("reader-heading");
const loading=document.getElementById("loading");
let currentKey="";
let currentBlobUrl="";
const cache={};

function decodeDocument(key){
  if(cache[key]) return cache[key];
  const bytes=Uint8Array.from(atob(DOCUMENTS[key]),character=>character.charCodeAt(0));
  cache[key]=new TextDecoder("utf-8").decode(bytes);
  return cache[key];
}

function renderDocument(key,updateHistory=true){
  if(!META[key]) return;
  homeScreen.hidden=true;
  reader.classList.add("is-open");
  document.body.style.overflow="hidden";
  heading.textContent=META[key].title;
  document.title=META[key].title+"｜中学英文法 完全攻略";
  document.querySelectorAll(".doc-tab").forEach(button=>{
    const active=button.dataset.doc===key;
    button.classList.toggle("is-active",active);
    button.setAttribute("aria-current",active?"page":"false");
  });
  if(currentKey!==key){
    currentKey=key;
    loading.classList.remove("is-hidden");
    frame.title=META[key].title;
    if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
    currentBlobUrl=URL.createObjectURL(new Blob([decodeDocument(key)],{type:"text/html;charset=utf-8"}));
    frame.src=currentBlobUrl;
  }else{
    frame.contentWindow.scrollTo(0,0);
  }
  if(updateHistory && location.hash!=="#"+key){
    history.pushState({document:key},"","#"+key);
  }
}

function showHome(updateHistory=true){
  reader.classList.remove("is-open");
  homeScreen.hidden=false;
  document.body.style.removeProperty("overflow");
  document.title="中学英文法 完全攻略｜JUKEN CAMP";
  if(updateHistory && location.hash){
    history.pushState({},"",location.pathname+location.search);
  }
}

function syncToLocation(){
  const key=location.hash.slice(1);
  if(META[key]) renderDocument(key,false); else showHome(false);
}

document.querySelectorAll("[data-doc]").forEach(button=>{
  button.addEventListener("click",()=>renderDocument(button.dataset.doc));
});
document.getElementById("home-button").addEventListener("click",()=>showHome());
document.getElementById("print-button").addEventListener("click",()=>{
  if(!currentKey) return;
  frame.contentWindow.focus();
  frame.contentWindow.print();
});
frame.addEventListener("load",()=>loading.classList.add("is-hidden"));
window.addEventListener("popstate",syncToLocation);
window.addEventListener("keydown",event=>{
  if(event.key==="Escape" && reader.classList.contains("is-open")) showHome();
});
syncToLocation();
